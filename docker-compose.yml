# OncoSuite on the shared VM: React UI (nginx) + Python backend, under /chat-bot.
# Public URL: http://204.168.157.213/chat-bot
#
# The VM's Caddyfile stays EXACTLY as it is:
#     handle /chat-bot* { reverse_proxy oncosuite:8014 }
#
# To make that work without touching Caddy, the two containers SWAP identities:
#   - `oncosuite`     (was the Python app) is now the UI/nginx container, :8014
#   - `oncosuite-api` (new name)           is the Python app, :8014, internal only
# Caddy therefore reaches the UI, which proxies /chat-bot/{ask,api,search} on to
# the backend over the internal network. Single origin, so no CORS.
#
# Deploy on the VM:
#   docker compose pull && docker compose up -d
services:
  # ---- Python API. Internal only; renamed so the UI can take `oncosuite`. ----
  oncosuite-api:
    image: deepak0105/oncosuite:latest
    # build: .
    container_name: oncosuite-api
    restart: unless-stopped
    env_file: .env
    # The whole app lives under /chat-bot and every hop passes that prefix through
    # unchanged, so the backend strips it itself. Matches .env.
    environment:
      ONCOSUITE_BASE_PATH: /chat-bot
      ONCOSUITE_HOST: 0.0.0.0
      ONCOSUITE_PORT: "8014"
    # No `ports:` -- reachable only from the UI container, never from outside.
    expose:
      - "8014"
    # Let the container reach services (Postgres, Ollama) running on the VM host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Hand-placed CSV for the RAG index build (kept out of the image / secrets-free).
      # Put oncosuite_lung_cancer.csv in ./data on the VM.
      - ./data:/data:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8014/chat-bot/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - default

  # ---- React UI. Owns the name `oncosuite` and port 8014 that Caddy targets. ----
  oncosuite:
    image: deepak0105/oncosuite-ui:latest
    # build:
    #   context: .
    #   dockerfile: frontend/Dockerfile
    container_name: oncosuite
    restart: unless-stopped
    depends_on:
      oncosuite-api:
        condition: service_healthy
    ports:
      # Optional -- for debugging on the VM (curl 127.0.0.1:8014/chat-bot/).
      # Caddy does NOT use this; it connects by container name over app-network.
      - "127.0.0.1:8014:8014"
    networks:
      # `default`: how this container reaches `oncosuite-api`.
      # `app-network`: how Caddy reaches THIS container as `oncosuite:8014`.
      - default
      - app-network

networks:
  app-network:
    external: true
