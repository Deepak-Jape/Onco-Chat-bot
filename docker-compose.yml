# OncoSuite backend on the shared VM.
#
# Backend-only: the frontend is ctsearch, built and deployed independently on the
# VM (git pull + npm run build, served as static files) -- NOT a Docker image
# built from this repo. This compose file only runs the Python API.
#
# The VM's Caddy reaches services by container name over the external
# `app-network` (same convention as its other services -- ct_prod, list_endpoints,
# analytics_endpoints, etc.), NOT via a published host port. Caddy's UAT site
# (204.168.157.213.sslip.io) needs a route added:
#     handle /chat-bot* {
#         reverse_proxy oncosuite:8014
#     }
# (already present on the plain-HTTP site and thinkaiindia.com; add the same
# block to the sslip.io site since ctsearch's .env now points there over HTTPS).
#
# Deploy on the VM:
#   docker compose up -d
services:
  oncosuite:
    image: deepak0105/oncosuite:latest
    # build: .
    container_name: oncosuite
    restart: unless-stopped
    env_file: .env
    environment:
      ONCOSUITE_HOST: 0.0.0.0
      ONCOSUITE_PORT: "8014"
      # Whole app lives under /chat-bot; Caddy passes the path through
      # unchanged and this app strips the prefix itself.
      ONCOSUITE_BASE_PATH: /chat-bot
    # No `ports:` -- reachable only by container name (`oncosuite:8014`) over
    # app-network, same as the VM's other backend services. Not published to
    # the host or the internet directly.
    expose:
      - "8014"
    # Let the container reach services (Postgres, Ollama) running on the VM host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Hand-placed CSV for the RAG index build (kept out of the image / secrets-free).
      # Put oncosuite_lung_cancer.csv in ./data on the VM.
      - ./data:/data:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8014/chat-bot/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - app-network

networks:
  app-network:
    external: true
