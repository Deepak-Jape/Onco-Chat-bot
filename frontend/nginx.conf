# Serves the built SPA under /chat-bot and proxies the data API to the backend
# container, resolved by service name via Docker's embedded DNS (no IPs, no host
# ports involved).
#
# NOTE: the upstream is `oncosuite-api`, NOT `oncosuite`. This container answers
# as `oncosuite:8014` so the VM's existing Caddy rule
# (`reverse_proxy oncosuite:8014`) needs no change -- so the Python backend was
# renamed to `oncosuite-api`. Pointing this at `oncosuite` would make nginx proxy
# to itself.
#
# Caddy forwards /chat-bot* with the prefix intact (`handle`, not `handle_path`),
# so this server sees /chat-bot/... too.

upstream oncosuite_api {
    server oncosuite-api:8014;
}

server {
    # 8014, not 80: Caddy connects to `oncosuite:8014`, and this container now
    # owns that name so that rule keeps working unchanged.
    listen 8014;
    server_name _;

    root /usr/share/nginx/html;

    # --- API: everything the frontend calls, handed to the Python app ---
    # /chat-bot/ask, /chat-bot/ask/stream, /chat-bot/ask/fast, /chat-bot/api/*,
    # /chat-bot/search/ExecutiveSummary. The backend runs with
    # ONCOSUITE_BASE_PATH=/chat-bot and strips the prefix itself, so pass the
    # path through unchanged (proxy_pass with no URI part).
    location ~ ^/chat-bot/(ask|api|search)(/|$) {
        proxy_pass http://oncosuite_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /ask/stream and /ask/fast are SSE: buffering would hold the step events
        # until the response completed, so the UI would show nothing then jump.
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no;

        # LLM synthesis and the multi-step agent are slow.
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 10s;
    }

    # Hashed build assets are immutable; index.html must never be cached or users
    # keep loading a stale bundle after a redeploy.
    location /chat-bot/assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --- SPA under the /chat-bot prefix ---
    # No server-side routes, so anything not matched above serves index.html.
    location /chat-bot {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }

    # Bare /chat-bot (no trailing slash) and the site root both land on the app.
    location = / {
        return 302 /chat-bot/;
    }
}
