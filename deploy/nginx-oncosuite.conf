# nginx (ON THE VM): serve OncoSuite under the /chat-bot PATH on the sslip.io host.
#
# The VM already runs nginx (for HRMS). Two ways to apply this:
#
#  (A) If HRMS uses server_name 204.168.157.213.sslip.io already: ADD just the
#      `location` blocks below into that existing server { } block. Do NOT create
#      a second server block for the same name.
#
#  (B) If there is no server block for this host yet: use this whole file as
#      /etc/nginx/sites-available/oncosuite, symlink it, then run certbot.
#
# CHANGED (UI release): 127.0.0.1:8014 is now the **UI container** (nginx serving
# the React build), not the Python app directly. The UI container proxies the API
# paths on to the backend container over the internal Docker network, so this file
# still needs only ONE location -- everything under /chat-bot goes to one place.
#
# The path prefix is passed through UNCHANGED (proxy_pass with no URI part / no
# trailing slash): the UI's nginx serves the SPA at /chat-bot, and the backend is
# base-path aware (ONCOSUITE_BASE_PATH=/chat-bot) and strips the prefix itself.

server {
    listen 80;
    server_name 204.168.157.213.sslip.io;

    # --- OncoSuite (React UI + API) under /chat-bot ---
    location /chat-bot {
        proxy_pass http://127.0.0.1:8014;      # NOTE: no trailing slash -> path preserved
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /chat-bot/ask/stream and /ask/fast are Server-Sent Events. Without these
        # the step updates get buffered here and the UI sits blank until the whole
        # answer is ready.
        proxy_buffering off;
        proxy_cache off;

        # LLM synthesis + multi-step agent can be slow.
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 10s;
    }

    location = /chat-bot/api/health {
        proxy_pass http://127.0.0.1:8014;
        access_log off;
    }

    # (HRMS and any other locations stay as they are in the real config.)
}

# TLS: sslip.io resolves 204.168.157.213.sslip.io -> 204.168.157.213, so certbot can
# issue a real cert for it:
#   sudo certbot --nginx -d 204.168.157.213.sslip.io
# certbot adds the 443 listener + redirect. Final URL: https://204.168.157.213.sslip.io/chat-bot
