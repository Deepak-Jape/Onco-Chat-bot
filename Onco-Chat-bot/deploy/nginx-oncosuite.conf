# nginx: serve OncoSuite under the /chat-bot PATH on the sslip.io host.
# The VM already runs nginx (for HRMS). Two ways to apply this:
#
#  (A) If HRMS uses server_name 204.168.157.213.sslip.io already: ADD just the two
#      `location` blocks below into that existing server { } block. Do NOT create a
#      second server block for the same name.
#
#  (B) If there is no server block for this host yet: use this whole file as
#      /etc/nginx/sites-available/oncosuite, symlink it, then run certbot.
#
# The app is base-path aware (ONCOSUITE_BASE_PATH=/chat-bot), so nginx passes the
# FULL path through unchanged -- no rewrite needed. The app strips /chat-bot itself.

server {
    listen 80;
    server_name 204.168.157.213.sslip.io;

    # --- OncoSuite under /chat-bot ---
    location /chat-bot {
        proxy_pass http://127.0.0.1:8014;      # NOTE: no trailing slash -> path preserved
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # LLM synthesis + multi-step agent can be slow.
        proxy_read_timeout    180s;
        proxy_send_timeout    180s;
        proxy_connect_timeout 10s;
    }

    location = /chat-bot/api/health {
        proxy_pass http://127.0.0.1:8014;
        access_log off;
    }

    # (HRMS and any other locations stay as they are in the real config.)
}

# TLS: sslip.io resolves 204.168.157.213.sslip.io -> 204.168.157.213, so certbot can
# issue a real cert for it:
#   sudo certbot --nginx -d 204.168.157.213.sslip.io
# certbot adds the 443 listener + redirect. Final URL: https://204.168.157.213.sslip.io/chat-bot
